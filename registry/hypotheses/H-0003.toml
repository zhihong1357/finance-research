id = "H-0003"
title = "流动性越差的永续合约，日内短期反转越强"
program = "P1"
return_source = "liquidity_provision"
mechanism = "急于成交的一方推动价格，提供流动性的一方承接存货，要求事后的价格回归作为补偿；存货风险和逆向选择越大的品种，要求的补偿越高。所以前一日跌得多的合约次日相对反弹，而且这种反转在流动性差的合约里更强。后一条是机制的推论，比单看反转更有区分力。"
counterparty = "急于成交、对价格不敏感的交易者：被强平的仓位、止损单、追涨杀跌的散户"
why_persistent = "存货风险是做市的真实成本，不因被发现而消失；但竞争会压缩大合约里的补偿，所以预期效应集中在中小合约"
why_us = "资金小，中小合约里的容量对我们够用，对大机构不值得"
falsification = "确认集上，按前一日收益排序的反转多空组合在低流动性组里扣成本后不显著为正；或者反转强度不随流动性变差而增大（推论不成立）"
prior = 0.3
data = ["binance.um.klines_1m.monthly"]
data_level = "L1"
power = "按 3.8 的功效计算，确认集 639 天，年化夏普 1 时 t ≥ 3（单侧）的检出概率 0.05，夏普 2 时 0.36。文献（Bianchi, Babiak & Dickerson 2022，Journal of Banking & Finance）发现加密市场的反转收益集中在交易不活跃的币对，且扣成本后可能所剩无几。所以这张卡在确认集上功效低；优先检验\"反转随流动性变强\"这一推论（组间差异的方差更小），整体效应预计要靠前向数据。"

[scope]
universe = "U1"
instruments = "Binance USDT 永续合约，按前 90 天日成交额中位数分为三个流动性组"
horizon = "1 天"
horizon_days = 1
output = "return"

[plan]
metric = "每个流动性组内，按前一日收益的五分组，最低组减最高组的次日收益（扣成本）；以及低流动性组与高流动性组之差"
test = "平稳自助法，块长自动选取，单侧；组间差用同一组自助样本"
controls = ["市场因子", "前一日成交额的变化", "资金费率"]
robustness = ["回看期 12 小时、2 天", "流动性按 4 组、5 组划分", "去掉前一日涨跌幅最大的 1% 合约", "成本加倍"]
embargo_days = 2

[plan.exploration]
start = 2019-12-01
end = 2024-01-31

[plan.confirmation]
start = 2024-02-01
end = 2025-10-31

[plan.vault]
start = 2025-11-01
end = 2026-10-31

