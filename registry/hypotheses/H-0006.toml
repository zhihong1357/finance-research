id = "H-0006"
title = "阳性对照 (a)：在 U1 探索集的真实日收益里植入已知强度的预测信号，整条确认流程必须检出它，并且估出的强度接近真值"
program = "P0"
return_source = "none"
mechanism = "真值已知的半合成检验（路线图 3.15 (a)）。取 U1 探索集末尾 639 天（2022-05-03 至 2024-01-31，与 U1 确认集等长）的真实日收益作为噪声，用 3.11 的方法（meta/planted.py）植入：r'_i,t+1 = r_i,t+1 + 强度 × sd_i × s_i,t。sd_i 是合约 i 在这 639 天里日收益的样本标准差；s 是均值 0、方差 1 的高斯序列，各合约之间独立、与收益独立，持续性 0（白噪声），由固定种子生成。植入三档：主档强度 0.08、半档 0.04、零档 0。真实收益里本来就有的厚尾、波动聚集、合约之间的相关、下架和缺数据全都保留，所以这比纯合成的 3.12 更接近真实确认检验；但 s 与市场无关，真实收益里的任何可预测性都与 s 不相关，不会混进估计值。"
counterparty = "不适用：元研究，研究对象是流程本身"
why_persistent = "不适用：元研究"
why_us = "不适用：元研究"
falsification = "流程不合格（不是市场假说被否定）的条件，任一成立即判本阳性对照失败：主档没有通过下面 [plan] 里写定的全部适用检查；或主档估出的强度不在 0.04 至 0.12 之间（真值 0.08 的 0.5 至 1.5 倍）；或零档通过了全部适用检查（流程把没有效应的数据判为有效应）。半档只报告，不参与判定。"
prior = 0.95
data = ["binance.um.klines_1m.monthly"]
data_level = "L1"
power = "手算，并用 src/finresearch/stats/power.py 的 sharpe_power 核对（2026-11-19），不读任何数据。组合每天的收益（标准化后）期望等于强度，方差约 1/N（s 在合约之间独立，所以合约之间的相关不进入方差），日夏普约等于 强度 × √N。有效观测 637 天（639 天减去隔离期 1 天，再减去最后一天没有次日收益）。按 N = 10（保守，下限）：主档日夏普 0.253，t 的期望 6.4，单侧 t ≥ 3 的检出概率 0.9995（峰度 6 时 0.9992）；半档 t 的期望 3.2，检出概率 0.57。按 N = 20：主档 t 的期望 9.0，检出概率约 1；半档 4.5，0.93。估出的强度的标准误约 √(1/(N × 637))：N = 10 时 0.0125，N = 20 时 0.0089；0.04 的容许误差分别是 3.2 和 4.5 个标准误。零档误报的概率由 3.12 量出的整条流程误报率决定，单侧 t ≥ 3 在正态近似下约 0.13%。效应大小是本卡选定的，不取自文献。推测（未核实）：折损夏普按规程第 7 节用 U1 账本的全部试验折损，账本的试验次数和方差现在未知；按 1,000 个等价独立试验、各试验日夏普标准差约 1/√637 估算，主档 N = 10 时折损夏普约 0.99，仍高于 0.95。"

[scope]
universe = "U1"
instruments = "替身窗口起点（2022-05-03）之前 90 天日成交额中位数最大的 20 个 Binance USDT 永续合约，名单只用起点之前的数据确定（含之后下架的；下架或缺数据的日子该合约不进当天的组合）"
horizon = "1 天"
horizon_days = 1
output = "none"

[plan]
metric = """主检验：每天按 s_i,t 给合约加权，次日组合收益 P_t+1 = (1/N_t) × Σ_i s_i,t × r'_i,t+1 / sd_i，N_t 是当天有数据的合约数。只用替身窗口 2022-05-03 至 2024-01-31，开头隔离 1 天。
预测方向：P 的均值为正。效应大小下限：按 meta/planted.py 的 estimate_strength（合并回归、过原点）估出的强度在 0.04 至 0.12 之间。
三档用同一个种子 20261119 生成同一组 s，只改强度；种子和强度注册时冻结，不得重抽。主档、零档各跑一次，半档一次，共三次运行，都按规程第 7 节计入 U1 的试验次数。
七项检查（规程第 5 节，src/finresearch/verdict.py 的 judge），全部写定、不取配置默认值：
1. t 统计量：t = P 的日夏普 ÷ 它的标准误（stats/sharpe.py 的 sharpe_standard_error，计入样本偏度和峰度），不做自相关修正，理由是 s 的持续性为 0，P 在时间上不相关；只看正方向，门槛 t ≥ 3.0（见 threshold_t）。
2. 折损夏普 ≥ 0.95（见 dsr_min），按 U1 账本的全部试验折损（规程第 7 节、决策 0025）。
3. 回测过拟合概率：不适用。没有从多组参数里选优，只有一组事先定好的做法。
4. 成本加倍：不适用。植入的是以波动率为单位的预测，没有成本模型；加入成本会把已知的真值和成本假设混在一起，本卡要检验的只是统计流程。
5. 去掉最好的 2 笔：不适用，理由同上（判定函数规定这两项同时适用或同时不适用）。
6. 参数扰动：不适用。信号没有可调参数，强度是被检验的真值本身。
7. 分段：替身窗口按时间等分为 4 段，各段 P 的均值为正的段数多于一半，即至少 3 段。"""
test = "t 统计量为 P 的日夏普除以非正态标准误，单侧（正方向），门槛 3.0；不用自助法，因为 P 按构造在时间上不相关。稳健性里另报平稳自助法（块长按 Patton-Politis-White 自动选取）的单侧 p 值，只报告，不参与判定"
threshold_t = 3.0
dsr_min = 0.95
pbo_max = 0.10
controls = ["零档（强度 0）：同一组 s、同一条流程，必须不通过", "s 与真实收益无关，所以真实收益里的动量、反转等可预测性不会混进估计值；另报 s 与当日收益的相关，应与 0 一致"]
robustness = ["半档（强度 0.04），只报告", "平稳自助法的 p 值，只报告", "N_t 少于 10 的日子剔除后重算，只报告"]
embargo_days = 1

[plan.exploration]
start = 2019-12-01
end = 2024-01-31

[plan.confirmation]
start = 2024-02-01
end = 2025-10-31

[plan.vault]
start = 2025-11-01
end = 2026-10-31

