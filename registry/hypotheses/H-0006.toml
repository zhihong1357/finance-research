note = "草稿（决策 0020）：没有读任何数据、没有跑任何运行。本卡只用 U1 探索集：运行用 exploration 段的时钟，时点查询接口最远只到 2024-01-31，读不到确认集和金库。卡的格式要求填 confirmation 和 vault，这里照 U1 的边界 B-0001 填写，本卡永远不在这两段上运行。注册后只跑上面写定的三次。格式目前不能表达\"只在探索集里做的、注册后的一次性检验\"，次数由卡上文字约束、不由注册表检查强制，已在拉取请求里提出"