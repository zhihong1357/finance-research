id = "H-0004"
title = "资金费结算前，付费一方平仓的压力推动价格，结算后回归"
program = "P2"
return_source = "structural_flow"
mechanism = "资金费只按结算那一刻的持仓收取。费率为正时，一部分短线多头在结算前平仓避费、结算后再开回；费率为负时空头反之。这股可预测的、与信息无关的买卖压力，应当让价格在结算前几十分钟朝付费一方平仓的方向偏移，结算后回归。费率绝对值越大，压力越大，这是可检验的推论。"
counterparty = "为避开一次资金费而在固定时刻平仓再开仓的短线交易者；他们为时点上的便利付出冲击和价差"
why_persistent = "结算时刻由交易所规则固定、事先公开；避费行为来自资金费的收取方式本身，规则不变它就在"
why_us = "效应在分钟级、容量很小，大资金不值得做；我们的规模在容量之内"
falsification = "确认集上，结算前 30 分钟、按费率符号构造的多空组合收益不显著为正；或者效应不随费率绝对值增大；或者结算后没有回归（说明是信息而非压力）"
prior = 0.2
data = ["binance.um.funding.monthly", "binance.um.klines_1m.monthly"]
data_level = "L1"
power = "确认集 639 天，按 8 小时结算约 1,917 次结算。按 3.8 的功效计算，每次结算的组合收益夏普要达到 0.088（年化约 2.9）才有 80% 的把握在 t ≥ 3（单侧）下检出；每次 0.05 时只有 0.21。没有找到直接研究结算前后方向性价格压力的文献；有一项研究发现结算后约两小时价差变宽（MDPI，样本只有两个月），只算间接线索。"

[scope]
universe = "U1"
instruments = "Binance USDT 永续合约中，前 90 天日成交额中位数不低于 1000 万美元、每 8 小时结算的合约"
horizon = "结算前 30 分钟至结算后 30 分钟"
horizon_days = 0.042
output = "return"

[plan]
metric = "每次结算前 30 分钟到结算时刻，做空正费率合约、做多负费率合约的组合收益（扣成本），按费率绝对值加权；结算后 30 分钟的反向收益单独报告"
test = "平稳自助法，以结算次数为单位、块长自动选取，单侧"
controls = ["同一时段、不是结算时刻的组合收益（例如前一小时同样长度的窗口）", "市场因子", "费率绝对值分组"]
robustness = ["窗口 15 分钟、60 分钟", "只用费率绝对值最大的一半", "按 Bybit 数据重做", "成本加倍", "去掉 2021 年"]
embargo_days = 1

[plan.exploration]
start = 2019-12-01
end = 2024-01-31

[plan.confirmation]
start = 2024-02-01
end = 2025-10-31

[plan.vault]
