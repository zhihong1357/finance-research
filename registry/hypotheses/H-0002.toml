id = "H-0002"
title = "横截面资金费率：做多资金费率低的永续合约、做空高的，扣成本后赚钱"
program = "P2"
return_source = "risk_premium"
mechanism = "资金费率高，说明想用杠杆做多的人多、愿意承接的空头少；多头每 8 小时付钱给空头，补偿空头承担的挤空和暴涨风险。按资金费率给合约排序，做空费率最高的一组、做多最低的一组，市场中性，收入来自两部分：收到的资金费差，以及拥挤多头事后的价格回落。"
counterparty = "用永续合约追涨、需要杠杆而不愿或不能借现货的投机者；他们为即时的杠杆多头敞口付费"
why_persistent = "杠杆需求来自散户的风险偏好，在牛市里系统性偏多；做市和期现套利的资本受保证金、交易所对手风险和资金成本限制，压不平费率（套利的限制，Shleifer & Vishny 1997）"
why_us = "资金小，能进中小合约；不需要速度，按 8 小时周期调仓；没有赎回压力，能扛住挤空的阶段"
falsification = "确认集上，按前一期资金费率排序的多空组合，资金费加价格变动扣成本后的收益不显著为正；或者收益全部来自资金费、价格部分显著为负且抵消资金费；或者只在 2021 年这类杠杆狂热期成立、其余子时期方向相反"
prior = 0.35
data = ["binance.um.funding.monthly", "binance.um.klines_1m.monthly"]
data_level = "L1"
power = "按 3.8 的功效计算，确认集 2024-02 至 2025-10 共 639 天。真实年化夏普为 3 时，t ≥ 3（单侧）的检出概率 0.83；为 1.5 时只有 0.15。文献里同类期现套利的样本内年化夏普为 7 到 10（Christin, Routledge, Soska & Zetlin-Jones 2022，工作论文，未发表），即使扣成本、衰减后只剩三分之一也可检出；更小的效应在确认集上检不出，要等前向数据。"

[scope]
universe = "U1"
instruments = "Binance USDT 永续合约中，前 90 天日成交额中位数不低于 1000 万美元的合约（含已下架）"
horizon = "8 小时（一个资金费结算周期）"
horizon_days = 0.334
output = "return"

[plan]
metric = "按上一结算期资金费率的横截面五分组，最低组减最高组的组合每期收益（资金费 + 价格变动，按 4.2 的成本模型扣成本），年化夏普和 t 统计量"
test = "平稳自助法，块长按 Patton-Politis-White 自动选取，单侧"
controls = ["市场因子（等权全体合约收益）", "合约的过去 7 天收益（排除动量的影响）", "合约的流动性分组"]
robustness = ["三分组、十分组", "去掉资金费率绝对值最大的 1% 期", "按 Bybit 数据重做", "成本加倍", "只用 8 小时结算的合约"]
embargo_days = 1

[plan.exploration]
start = 2019-12-01
end = 2024-01-31

[plan.confirmation]
start = 2024-02-01
end = 2025-10-31

[plan.vault]
start = 2025-11-01
end = 2026-10-31

