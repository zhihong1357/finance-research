id = "H-0007"
title = "阳性对照 (b)：加密市场横截面动量，过去 3 周涨得多的永续合约下周仍跑赢涨得少的"
program = "P1"
return_source = "behavioral"
mechanism = "复现 Liu, Tsyvinski & Wu (2022) 的横截面动量（Journal of Finance 77(2)，1133–1177 页）。原文每周按过去 3 周的收益把币分成五组，做多最高组、做空最低组。原文给的解释偏向投资者对信息反应不足、关注度逐步扩散（行为金融），而不是风险补偿；动量在大市值币里更强。我们在 Binance USDT 永续合约上做对应的版本：每周一 00:00 UTC 按过去 21 天的收益分五组，等权，持有一周。与原文的差别：(1) 品种是永续合约，不是现货，持有收益要计入资金费；(2) 原文按市值加权，我们没有市值数据，主检验用等权，按成交额加权放在稳健性里；(3) 原文样本是 2014 至 2018 年、上千个币（含市值 100 万美元以上的小币），我们是 2024-02 至 2025-10、只有成交额够大的永续合约，大致对应原文里动量更强的大市值那一半；(4) 原文不扣成本，我们按 4.2 的成本模型扣成本；(5) 原文是周收益按自己划分的 52 周，我们用自然周（周一至下周一）。"
counterparty = "对信息反应慢的交易者：在已经上涨的币上过早卖出、在已经下跌的币上过早买入的一方"
why_persistent = "推测，未核实：如果来源是关注度和信息扩散的速度，它会随市场成熟、套利资本增加而减弱；原文发表（2022 年）之后的效应可能已经缩小。这正是成功标准要事先写定的原因"
why_us = "每周调仓一次，不需要速度；资金小，能进中等流动性的合约"
falsification = "前向窗口上（决策 0027：注册之后的第一个周一起，至少 527 周，注册时写死起止日期，窗口结束后只跑一次），按 [plan] 写定的做法，五分组最高组减最低组的周收益（含资金费、扣正常成本）没有通过全部适用检查；或均值为负。本卡不在确认集上运行"
prior = 0.30
data = ["binance.um.klines_1m.monthly", "binance.um.funding.monthly"]
data_level = "L1"
power = """效应大小取自原文，不读我们的数据。核实过的（2026-11-19 读了 NBER 工作论文 w25882，2019 年 5 月版，原文表 4）：3 周动量五分组最高减最低，按市值加权，周均值 4.1%，t = 2.742；样本 2014 至 2018 年，按每年 52 周约 260 周，所以周夏普约 2.742 ÷ √260 ≈ 0.17（年化约 1.23）。原文还写：按市值中位数分两组，大的一组动量周收益 4.2%、显著，小的一组 0.6%、不显著；原文明说没有考虑交易成本。期刊版的数字可能因样本延长而不同，期刊版正文没有读到（出版信息 3.0 已核对）。
用 src/finresearch/stats/power.py 的 sharpe_power 计算：确认集扣掉 7 天隔离期后，从 2024-02-12（周一）到 2025-10-20 开始的一周共 89 周。周夏普 0.17 时，单侧 t ≥ 3 的检出概率只有 0.078（峰度 5 时 0.077）；如果发表后衰减、扣成本后只剩一半（0.085），检出概率 0.014。周夏普 0.17 要有 80% 的把握，约需 527 周（10 年）。
结论：即使动量和原文一样强，确认集也只有约 8% 的机会检出。本卡如果失败，几乎不能说明流程有问题；成功则说明效应比原文更强或运气好。门槛不为此放宽：阳性对照要检验的就是真实假说面对的同一道关。
所有者决定（决策 0027，2026-11-19）：改在前向数据上检验。窗口长度按上面的 527 周（80% 把握）取下限；效应只有文献一半时，同样把握要约 4 倍长。决策 0021 的格式（plan.forward）实现之前本卡不注册；实现之后把窗口写进 plan.forward。[plan] 已按前向窗口改写；确认集上的 89 周和 0.078 只作为改用前向数据的理由保留在这里。"""

[scope]
universe = "U1"
instruments = "Binance USDT 永续合约中，形成日之前 90 天日成交额中位数不低于 1000 万美元、形成日之前有完整 21 天收益的合约（含已下架；持有期内下架的，按最后成交价平仓）。某周符合条件的合约少于 10 个时，该周不交易、不计入"
horizon = "7 天"
horizon_days = 7
output = "return"

[plan]
metric = """每周一 00:00 UTC 形成：信号 = 形成时刻之前 21 天（从形成时刻往前 21 × 24 小时到形成时刻）的对数收益，不跳过最近一周（与原文 r_3,0 一致）。按信号分五组，等权，做多最高组、做空最低组，持有到下周一 00:00。周收益 = 价格变动 + 持有期内收付的资金费 − 按 4.2 的成本模型、正常成本情形的成本（模拟器 4.3，保守成交）。
预测方向：周收益均值为正。效应大小下限：扣成本后的周均值 ≥ 0.5%（原文毛收益 4.1% 的八分之一左右，低于这个数即使显著也没有经济意义）。
只用前向窗口（决策 0027）：起点是注册之后的第一个周一 00:00 UTC，至少 527 个不重叠的周，起止日期注册时写死；窗口开头隔离 7 天。确认集不用。
七项检查（规程第 5 节，src/finresearch/verdict.py 的 judge），全部写定、不取配置默认值：
1. t 统计量：t = 周收益的夏普 ÷ 它的标准误（stats/sharpe.py 的 sharpe_standard_error，计入样本偏度和峰度），周与周不重叠，不做自相关修正；只看正方向，门槛 t ≥ 3.0。
2. 折损夏普 ≥ 0.95，按 U1 账本的全部试验折损（规程第 7 节、决策 0025）。
3. 回测过拟合概率：不适用。回看期 21 天和五分组照搬原文，我们没有在多组参数里选优（原文作者在 1、2、3、4 周里选了 3 周，这是原文样本里的选择，不在我们的数据上）。
4. 成本加倍：适用。成本加倍后周均值仍为正。
5. 去掉最好的 2 笔：适用。\"笔\"按周算：去掉收益最高的 2 周后周均值仍为正。
6. 参数扰动：适用。回看期上下 20%（17 天、25 天），两种做法的周均值都为正。
7. 分段：窗口内的周按时间等分为 4 段（不能整除时，余下的周放进最后一段），周均值为正的段数至少 3 段。"""
test = "t 统计量为不重叠周收益的夏普除以非正态标准误，单侧（正方向），门槛 3.0。稳健性里另报平稳自助法（块长自动选取）的单侧 p 值，只报告，不参与判定"
threshold_t = 3.0
dsr_min = 0.95
pbo_max = 0.10
controls = ["市场因子（符合条件的合约等权收益）", "合约的资金费率（排除 H-0002 的横截面资金费率效应）", "合约的成交额分组"]
robustness = ["按前 90 天成交额加权代替等权，接近原文的市值加权", "三分组（原文附录也用了三分组）", "回看 7、14、28 天（原文 1、2、4 周）", "只做多最高组、做空 BTC（原文第 5 节的做法）", "压力成交情形"]
embargo_days = 7

[plan.exploration]
start = 2019-12-01
end = 2024-01-31

[plan.confirmation]
start = 2024-02-01
end = 2025-10-31

[plan.vault]
start = 2025-11-01
