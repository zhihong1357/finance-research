id = "H-0008"
title = "阳性对照 (c)：比特币的波动率风险溢价，DVOL 平均高于之后 30 天的实现波动率"
program = "P4"
return_source = "risk_premium"
mechanism = "期权的卖方承担波动率突然上升的风险（这种风险恰好在市场下跌、人最缺钱的时候到来），所以要求补偿：期权隐含的波动率平均高于事后实际实现的波动率，差额就是波动率风险溢价。DVOL 是 Deribit 根据比特币期权价格算出的 30 天隐含波动率指数（年化，百分点）。本卡检验：每个 30 天窗口开始时的 DVOL，减去这 30 天里比特币实际的实现波动率，平均为正。研究宇宙 U1，三段边界沿用 U1 的 B-0001（决策 0019）。"
counterparty = "为下跌和波动上升买保险的一方：买入看跌期权对冲现货或杠杆多头的持有者，以及需要凸性敞口的投机者"
why_persistent = "补偿的是不能分散的风险：波动上升和下跌同时发生，卖方要的报酬不会因为被发现而消失，只会随承担风险的资本多少而变化（股指上的证据见 Carr & Wu 2009、Bollerslev, Tauchen & Zhou 2009，本次没有核对原文）"
why_us = "本卡输出的是波动率，进风险模型，不直接交易期权：用来校准\"隐含波动率偏高多少\"，以及检验流程能不能找出一个文献普遍报告的效应"
falsification = "确认集上，按 [plan] 写定的做法，DVOL 减实现波动率的差值没有通过全部适用检查；或均值为负"
prior = 0.75
data = ["deribit.dvol", "binance.um.klines_1m.monthly"]
data_level = "L1"
power = """效应大小取自文献，不读我们的数据。
核实过的：Almeida, Grith, Miftachov & Wang，Risk Premia in the Bitcoin Market，arXiv:2410.15195（v2，2025-08-01；预印本，没有找到期刊发表信息），2026-11-19 读了原文第 2 至 5 节和表 5：用 Deribit 期权自建的 27 天隐含方差（不是 DVOL），样本期权数据 2017-07 至 2022-12；风险溢价定义为隐含方差减实现方差（年化方差单位），全样本均值 0.14（隐含 0.72、实现 0.58，表 5 B 栏，1,017 天），低波动时期 0.17、高波动时期 0.12。原文没有给风险溢价的标准误、t 统计量或为正的天数比例。
部分核实：Alexander & Imeraj，The Bitcoin VIX and its Variance Risk Premium，Journal of Alternative Investments 23(4)，84–109 页，2021 年春季刊。这些出版信息来自检索结果里 Sussex 机构存档的条目摘要，存档页本身和 SSRN 页都拒绝访问（403），原文没有读到，正文结论未核实。
推测（未核实）：把原文的方差换算成波动率，√0.72 − √0.58 ≈ 0.087，即约 9 个波动率点（这是我对均值开根号的近似，不等于逐日差值的均值）。每个 30 天窗口的差值的标准差原文没有给，凭比特币月度实现波动率的波动幅度推测在 10 到 20 个点之间，所以每个窗口的标准化效应 d（均值 ÷ 标准差）约 0.4 到 0.9。
用 src/finresearch/stats/power.py 的 sharpe_power 计算：确认集扣掉 30 天隔离期后，从 2024-03-02 起共 20 个不重叠的 30 天窗口。单侧 t ≥ 3 的检出概率：d = 0.4 时 0.09，0.6 时 0.28，0.8 时 0.51，1.0 时 0.71（峰度 4 时分别 0.09、0.25、0.45、0.62）。折损夏普在只有 20 个观测时更难通过，会进一步降低检出概率，账本的试验数未知，没有量化。
结论：检不检得出取决于没有文献数字支撑的离散度，大致在两成到七成之间。确认集的长度是瓶颈；用重叠的逐日窗口不能增加信息（3.12 发现 Newey–West 在重叠持仓上低估长期方差），所以主检验坚持不重叠窗口。"""

[scope]
universe = "U1"
instruments = "BTC：Deribit 的 BTC DVOL（1 小时 K 线）对 Binance BTCUSDT 永续合约（1 分钟 K 线）"
horizon = "30 天"
horizon_days = 30
output = "volatility"

[plan]
metric = """窗口：从 2024-03-02 00:00 UTC（确认集起点加 30 天隔离期）起，连续、不重叠的 30 天窗口，最后一个必须在 2025-10-31 之前结束，共 20 个。
每个窗口 k：IV_k = 窗口起点那一刻已经收盘的最后一根 DVOL 1 小时 K 线的收盘值（即 00:00 结束的那一根），年化百分点。RV_k = 100 × √(365/30 × Σ 5 分钟对数收益²)，5 分钟收益由 BTCUSDT 永续合约 1 分钟 K 线的收盘价取每 5 分钟一个点计算，覆盖窗口内全部 8,640 个 5 分钟。缺数据的 5 分钟按缺失处理，窗口内缺失超过 1% 时该窗口作废并报告，不补值。
效应 x_k = IV_k − RV_k（波动率点）。预测方向：x 的均值为正。效应大小下限：x 的均值 ≥ 3 个波动率点。
七项检查（规程第 5 节，src/finresearch/verdict.py 的 judge），全部写定、不取配置默认值：
1. t 统计量：t = x 的均值 ÷ (x 的样本标准差 ÷ √20)，即 x 的夏普除以标准误，用 stats/sharpe.py 的 sharpe_standard_error（计入偏度和峰度）；窗口不重叠，不做自相关修正；只看正方向，门槛 t ≥ 3.0。
2. 折损夏普 ≥ 0.95，按 U1 账本的全部试验折损（规程第 7 节、决策 0025），把 x 当作一个收益序列计算。
3. 回测过拟合概率：不适用。没有在多组参数里选优；30 天来自 DVOL 本身的定义，5 分钟采样事先定好。
4. 成本加倍：不适用。本卡输出波动率预测、自己不交易，没有成本。
5. 去掉最好的 2 笔：不适用，理由同上（判定函数规定这两项同时适用或同时不适用）。
6. 参数扰动：适用。实现波动率的采样间隔上下 20%（4 分钟、6 分钟），两种做法的 x 均值都为正。
7. 分段：20 个窗口按时间顺序等分为 4 段、每段 5 个，x 的均值为正的段数至少 3 段。"""
test = "t 统计量为 20 个不重叠窗口的 x 的夏普除以非正态标准误，单侧（正方向），门槛 3.0。稳健性里另报符号检验（x 为正的窗口数）的单侧 p 值，只报告，不参与判定"
threshold_t = 3.0
dsr_min = 0.95
pbo_max = 0.10
controls = ["窗口起点前 30 天的实现波动率（区分\"隐含高于未来\"和\"隐含只是跟着过去走\"）", "窗口起点的 DVOL 水平分高低两组分别报告（原文：低波动时期溢价更高）"]
robustness = ["方差单位：IV² − RV²（与 Almeida 等原文的定义一致）", "实现波动率的采样间隔改为 1 分钟和 15 分钟，只报告", "窗口起点平移 10 天、20 天（另外两组不重叠窗口），只报告", "去掉 x 绝对值最大的 1 个窗口"]
embargo_days = 30

[plan.exploration]
start = 2021-03-01
end = 2024-01-31

[plan.confirmation]
start = 2024-02-01
end = 2025-10-31

