# U1 的时点表（Phase 2.5，决策 0010）：按归档清单下载交易所的归档文件（Binance 的 1 分钟 K 线、
# Bybit 的逐笔成交），核对大小、ETag 和校验和，加工成按月分区的时点表，推到数据集。每张表、
# 每个交易所的每个月一个任务，一个失败不影响其他。已经加工过的月份不再加工（远程存储只追加）。
# 每月 15 日运行一次，补上刚结束的那个月。表和数据集的对应关系在 config/u1.toml。
name: U1 1 分钟数据

on:
  schedule:
    - cron: "47 4 15 * *"    # 每月 15 日 04:47 UTC：月度文件已出现，周一的归档清单已经列到
  workflow_dispatch:
    inputs:
      table:
        description: 只加工这张表（config/u1.toml 里的表名，如 u1.bars_1m；填 all 加工全部）
        required: false
        default: all
      exchange:
        description: 只加工这个交易所
        required: false
        default: all
        type: choice
        options: [all, binance, bybit]
      months:
        description: 只加工这些月份（如 2026-09,2026-10，要同时选表和交易所；留空按计划加工全部未完成的月份）
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: u1-bars
  cancel-in-progress: false

jobs:
  plan:
    name: 列出要加工的月份
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - id: plan
        name: 列出
        env:
          TABLE: ${{ inputs.table }}
          EXCHANGE: ${{ inputs.exchange }}
          MONTHS: ${{ inputs.months }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          # 定时运行时输入为空，手动运行时默认 all：两种都表示"全部"
          if [ "$TABLE" = all ]; then TABLE=""; fi
          if [ "$EXCHANGE" = all ]; then EXCHANGE=""; fi
          if [ -n "$MONTHS" ]; then
            if [ -z "$TABLE" ] || [ -z "$EXCHANGE" ]; then echo "选月份时要同时选表和交易所"; exit 1; fi
            echo "jobs=$(jq -cn --arg t "$TABLE" --arg e "$EXCHANGE" --arg m "$MONTHS" '$m | split(",") | map(gsub(" "; "")) | map({table: $t, exchange: $e, month: .})')" >> "$GITHUB_OUTPUT"
          else
            args=()
            if [ -n "$TABLE" ]; then args+=(--table "$TABLE"); fi
            if [ -n "$EXCHANGE" ]; then args+=(--exchange "$EXCHANGE"); fi
            echo "jobs=$(uv run finresearch u1 plan "${args[@]}")" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    name: ${{ matrix.table }} ${{ matrix.exchange }} ${{ matrix.month }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300       # Bybit 近期的一个月要下载几十 GB 的逐笔成交
    strategy:
      fail-fast: false
      max-parallel: 2          # Bybit 限制每个地址的请求频率（collect.toml），不靠多开任务绕过它
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - name: 下载、核对、加工、推送
        env:
          TABLE: ${{ matrix.table }}
          EXCHANGE: ${{ matrix.exchange }}
          MONTH: ${{ matrix.month }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: uv run finresearch u1 build --table "$TABLE" --exchange "$EXCHANGE" --month "$MONTH"
