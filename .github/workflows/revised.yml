# 修订版本表（Phase 2.6，决策 0013）：采集之后半小时，把每个数据源到目前为止的全部原始响应
# 合并成一张表；内容与最新的一份相同就不写。手动运行时可以选"核对"：用最新一份卡片上记的
# 原始响应重新加工一遍，比对内容指纹，不推送。每张表一个任务，一张失败不影响其他。
# 公开日志只写响应数、行数和结论（决策 0008）。
name: 修订版本表

on:
  schedule:
    - cron: "47 */8 * * *"   # 每 8 小时：采集（第 17 分钟）之后半小时
  workflow_dispatch:
    inputs:
      mode:
        description: build（加工）或 verify（核对）
        required: true
        default: build

permissions:
  contents: read

concurrency:
  group: revised
  cancel-in-progress: false

jobs:
  plan:
    name: 列出表
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tables: ${{ steps.plan.outputs.tables }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - id: plan
        name: 列出
        run: echo "tables=$(uv run finresearch revised plan)" >> "$GITHUB_OUTPUT"

  table:
    needs: plan
    if: needs.plan.outputs.tables != '[]'
    name: ${{ matrix.table }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        table: ${{ fromJSON(needs.plan.outputs.tables) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - name: 加工或核对
        env:
          TABLE: ${{ matrix.table }}
          MODE: ${{ inputs.mode || 'build' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          case "$MODE" in
            build|verify) uv run finresearch revised "$MODE" --table "$TABLE" ;;
            *) echo "unknown mode: $MODE"; exit 1 ;;
          esac
