# 存储自检（Phase 2.1 验收）：从 GitHub Actions 向 Hugging Face 私有数据集写入随机字节，
# 读回、核对指纹、计时，最后删除。只能手动触发。日志只打印大小、耗时和次数，不打印数据。
name: 存储自检

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: 写入、读回、核对
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - name: 自检
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"  # 进度条会把日志刷成几百行
        run: uv run finresearch storage selftest --run-id "run-${{ github.run_id }}"
