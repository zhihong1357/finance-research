# U1 的数据画像（Phase 2.8）：品种数量、流动性分布、有效广度。只读探索集（决策 0015）。
# 结果由第三方数据得出，只存私有数据集；公开日志只写做了什么（决策 0008）。只手动运行。
name: 数据画像

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  exchange:
    name: ${{ matrix.exchange }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        exchange: [binance, bybit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - name: 画像
        env:
          EXCHANGE: ${{ matrix.exchange }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: uv run finresearch profile run --exchange "$EXCHANGE"
