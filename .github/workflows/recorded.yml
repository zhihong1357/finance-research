# 录制类数据的规范层（Phase 2.10）：把 Deribit、Hyperliquid、DVOL 的原始响应按月加工成时点表。
# 每月 4 日自动加工上个月（等一个月最后的数据都抓到），也可手动运行：build 加工，verify 从卡片上的响应重建核对。
name: 录制类规范层

on:
  schedule:
    - cron: "19 6 4 * *"   # 每月 4 日 06:19 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: build（加工）或 verify（重建核对）
        required: false
        default: build
        type: choice
        options: [build, verify]

permissions:
  contents: read

concurrency:
  group: recorded
  cancel-in-progress: false

jobs:
  plan:
    name: 列出表
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tables: ${{ steps.plan.outputs.tables }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - id: plan
        name: 列出
        run: echo "tables=$(uv run finresearch recorded plan)" >> "$GITHUB_OUTPUT"

  table:
    needs: plan
    name: ${{ matrix.table }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        table: ${{ fromJSON(needs.plan.outputs.tables) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - name: 运行
        env:
          TABLE: ${{ matrix.table }}
          MODE: ${{ inputs.mode || 'build' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: uv run finresearch recorded "$MODE" --table "$TABLE"
