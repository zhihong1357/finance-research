# 采集（Phase 2.2）：定时组的 cron 一到，先列出这个组里启用的数据源，再给每个数据源
# 单独起一个任务。一个数据源失败不影响其他（fail-fast: false）。
# cron 必须与 config/collect.toml 的 groups 一致，测试会核对。
name: 采集

on:
  schedule:
    - cron: "17 */8 * * *"   # every8h
    - cron: "23 */4 * * *"   # every4h
  workflow_dispatch:
    inputs:
      group:
        description: 定时组（config/collect.toml 的 groups）
        required: true
        default: every4h

permissions:
  contents: read

concurrency:
  group: collect-${{ github.event.schedule || inputs.group }}
  cancel-in-progress: false

jobs:
  plan:
    name: 列出数据源
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - id: plan
        name: 列出
        env:
          CRON: ${{ github.event.schedule }}
          GROUP: ${{ inputs.group }}
        run: echo "sources=$(uv run finresearch collect plan --cron "$CRON" --group "$GROUP")" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    if: needs.plan.outputs.sources != '[]'
    name: ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: 安装
        run: uv sync --locked

      - name: 采集并推送
        env:
          SOURCE: ${{ matrix.source }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: uv run finresearch collect run --source "$SOURCE"
