# 噪声工厂（Phase 3.10，src/finresearch/meta/noise.py）的参数。
# 全部是示意值，量级取自加密永续合约日收益的常见说法，没有核对；3.14 用 U1 探索集反推之后，
# 校准值由第三方数据得出，只存私有数据集（决策 0008），不改这里。
# 模型：收益 = 载荷 × 市场因子 + 品种自己的部分；两部分各自是 GARCH(1,1)，新息是方差为 1 的 t 分布。

[factor]
variance = 0.0016        # 无条件日方差（日波动率 4%）
arch = 0.08              # 上一期冲击平方的权重
garch = 0.90             # 上一期条件方差的权重；arch + garch < 1
dof = 5.0                # t 分布的自由度（> 2）

[idiosyncratic]
variance = 0.0009        # 日波动率 3%
arch = 0.06
garch = 0.92
dof = 4.5

[loadings]
mean = 1.0               # 载荷的均值；反推时按均值 1 归一
spread = 0.3             # 载荷在 mean ± spread 之间均匀排开

[simulation]
burn_in = 500            # 先生成再丢掉的期数，让条件方差离开初值

# ---- 更粗糙的噪声（2026-11-19）：三种可选成分，默认全部关闭；关闭时生成的数据与加入之前逐位相同。
# 全部是示意值，量级是猜的，没有找到能直接用的文献数字（见 docs/meta-research-dry-run.md 的"更粗糙的噪声"一节）。
# 三种成分都与过去的收益无关、对称、期望为 0，不制造任何优势。

[regimes]
# 两状态马尔可夫切换（平静、动荡）。动荡时因子的波动放大得比品种自己的部分多，品种之间更相关。
# 平静时的倍数按"无条件方差不变"自动算出，所以打开它不改变总波动，只改变波动在时间上的分布。
enabled = false
to_turbulent = 0.02      # 平静的一天转入动荡的概率：平静期平均 50 天
to_calm = 0.1            # 动荡的一天回到平静的概率：动荡期平均 10 天；约 1/6 的日子动荡
factor_ratio = 3.0       # 动荡/平静 的因子波动之比
idiosyncratic_ratio = 1.5  # 动荡/平静 的品种自身波动之比

[jumps]
# 跳空：少数日子叠加一次大幅跳动，大小是方差为 1 的 t 分布乘以尺度，方向对称、期望为 0。
enabled = false
factor_probability = 0.005       # 全市场一起跳的日子：约每年 1.8 次（365 天）
idiosyncratic_probability = 0.01 # 单个品种自己跳的日子：约每年 3.7 次
factor_scale = 0.06              # 全市场跳动的标准差 6%（平常日波动 4% 的 1.5 倍，再乘 t 的厚尾）
idiosyncratic_scale = 0.08       # 单品种跳动的标准差 8%
dof = 3.0                        # 跳动大小的 t 自由度（> 2）：尾巴很厚

[delisting]
# 下架：每个品种每天以固定概率永久退出，退出时刻与收益无关，从那天起没有收益。
enabled = false
hazard = 0.0003          # 每天 0.03%：约每年 10%，2,500 天里约 53% 的品种留到最后
