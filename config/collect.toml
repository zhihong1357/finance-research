# 采集与监控（Phase 2.2）。每个数据源属于一个定时组；定时组的 cron 必须与
# .github/workflows/collect.yml 里的一致（有测试核对）。时间一律是 UTC。

[groups.every8h]
cron = "17 */8 * * *"           # 每 8 小时，在第 17 分钟（避开整点的拥挤）

[groups.every4h]
cron = "23 */4 * * *"           # 每 4 小时：快照类数据源，错过就补不回来

[http]
timeout_seconds = 30
retries = 2                     # 超时、断线、429、5xx 时重试的次数
retry_wait_seconds = 5
user_agent = "finresearch/0.1 (personal research; https://github.com/zhihong1357/finance-research)"

[http.max_per_second]           # 每个主机每秒最多几个请求（所有线程合计）
"public.bybit.com" = 5          # 一个地址几分钟内发了约 2,000 个请求，Bybit 就回 403（2026-11-13 两次实测）；每秒 5 个是每 5 分钟 1,500 个

[sources."heartbeat.canary"]
group = "every8h"
max_age_hours = 17              # 超过这么久没有新记录就算中断：两次运行的间隔加一小时余量
added = "2026-11-14T00:00:00Z"  # 加入的时刻；在此之后 max_age_hours 内还没有数据不算中断
enabled = true

[sources."heartbeat.drill"]
group = "every8h"
max_age_hours = 17
added = "2026-11-13T00:00:00Z"
enabled = false                 # 演练已完成（问题 #16 开出又自动关闭）；需要再次演练时打开
simulate_failure = false

[sources."deribit.book_summary"]
group = "every4h"
max_age_hours = 9               # 两次运行的间隔加一小时余量
added = "2026-11-15T00:00:00Z"
enabled = true
currencies = ["BTC", "ETH", "USDC"]   # USDC 下面是线性的期货、永续和期权（SOL、XRP 等）
kinds = ["future", "option"]

[sources."hyperliquid.asset_ctxs"]
group = "every4h"
max_age_hours = 9
added = "2026-11-15T00:00:00Z"
enabled = true

[monitor]
issue_marker = "finresearch:outage"   # 监控开的问题里带这个标记，用来认出自己开过的问题
inactivity_warn_days = 45             # 公开仓库 60 天无活动会停用定时任务；45 天时提醒所有者
storage_quota_gb = 100                # Hugging Face 免费账户的私有存储额度（架构 7.3）
storage_warn_gb = 80                  # 决策 0010：私有数据集超过这么多就开问题，重新考虑存储
scheduled_workflows = [
  ".github/workflows/collect.yml",
  ".github/workflows/monitor.yml",
  ".github/workflows/archive.yml",
  ".github/workflows/u1-bars.yml",
]
