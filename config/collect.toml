# 采集与监控（Phase 2.2）。每个数据源属于一个定时组；定时组的 cron 必须与
# .github/workflows/collect.yml 里的一致（有测试核对）。时间一律是 UTC。

[groups.every8h]
cron = "17 */8 * * *"           # 每 8 小时，在第 17 分钟（避开整点的拥挤）

[groups.weekly]
cron = "41 6 * * 1"             # 每周一 06:41：更新慢的数据源（费城联储的实时数据集每月更新）

[groups.cot]
cron = "47 20 * * 1,2,5"        # 周一、二、五 20:47 UTC：CFTC 持仓报告 15:30（纽约）公布之后；周一、二接假日顺延的

[groups.daily]
cron = "53 1 * * *"             # 每天 01:53 UTC

[groups.every4h]
cron = "23 */4 * * *"           # 每 4 小时：快照类数据源，错过就补不回来

[http]
timeout_seconds = 30
retries = 2                     # 超时、断线、429、5xx 时重试的次数
retry_wait_seconds = 5
user_agent = "finresearch/0.1 (personal research; https://github.com/zhihong1357/finance-research)"

[http.max_per_second]           # 每个主机每秒最多几个请求（所有线程合计）
"public.bybit.com" = 5
"www.deribit.com" = 5           # DVOL 第一次补历史要几百个请求，放慢一点          # 一个地址几分钟内发了约 2,000 个请求，Bybit 就回 403（2026-11-13 两次实测）；每秒 5 个是每 5 分钟 1,500 个

[sources."heartbeat.canary"]
group = "every8h"
max_age_hours = 17              # 超过这么久没有新记录就算中断：两次运行的间隔加一小时余量
added = "2026-11-14T00:00:00Z"  # 加入的时刻；在此之后 max_age_hours 内还没有数据不算中断
enabled = true

[sources."heartbeat.drill"]
group = "every8h"
max_age_hours = 17
added = "2026-11-13T00:00:00Z"
enabled = false                 # 演练已完成（问题 #16 开出又自动关闭）；需要再次演练时打开
simulate_failure = false

[sources."deribit.book_summary"]
group = "every4h"
max_age_hours = 9               # 两次运行的间隔加一小时余量
added = "2026-11-15T00:00:00Z"
enabled = true
currencies = ["BTC", "ETH", "USDC"]   # USDC 下面是线性的期货、永续和期权（SOL、XRP 等）
kinds = ["future", "option"]

[sources."hyperliquid.asset_ctxs"]
group = "every4h"
max_age_hours = 9
added = "2026-11-15T00:00:00Z"
enabled = true

[sources."nyfed.reference_rates"]
group = "every8h"
max_age_hours = 17
added = "2026-11-16T00:00:00Z"
enabled = true
rates = { SOFR = "secured/sofr", EFFR = "unsecured/effr" }   # 利率名 -> 接口路径
lookback_days = 30              # 平常只取最近 30 天：足够跨过长假，每次约 10 KB
history_start = "2000-01-01"    # 取全部历史时的起点；EFFR 最早到 2000-07-03，SOFR 到 2018-04-02
full_history_weekday = 6        # 每周日（UTC，周一是 0）第一次运行取全部历史，顺便核对旧值没有被改
full_history_before_hour = 8    # "第一次运行"：每 8 小时一次，所以是 8 点之前那次

[sources."philly.rtdsm"]
group = "weekly"
max_age_hours = 192             # 一周一次，加一天余量
added = "2026-11-16T00:00:00Z"
enabled = true
# 变量页面 -> 工作簿文件名。有月度版本的用月度版本（版本多，更接近公布时刻），没有的用季度版本
files = { routput = "routputMvQd.xlsx", p = "pMvQd.xlsx", pcpi = "pcpiMvMd.xlsx", pcpix = "pcpixMvMd.xlsx", pcon = "pconQvQd.xlsx", pconx = "pconxMvQd.xlsx", ruc = "rucQvMd.xlsx", employ = "employMvMd.xlsx", ipt = "iptMvMd.xlsx" }

[sources."cftc.cot_tff"]
group = "cot"
max_age_hours = 80              # 周五到下周一隔 72 小时，加余量
added = "2026-11-16T00:00:00Z"
enabled = true
history_start = "2006-01-01"    # 取全部历史时的起点；金融期货持仓报告从 2006-06-13 起
lookback_days = 60              # 平常只取最近 60 天
backfill_days = 7               # 加入后一周内取全部历史
full_history_months = [1, 4, 7, 10]   # 每季度第一个月的前几天再取一次全部历史，核对旧报告没有被改
full_history_first_days = 7

[sources."deribit.dvol"]
group = "daily"
max_age_hours = 26
added = "2026-11-16T00:00:00Z"
enabled = true
currencies = ["BTC", "ETH"]
lookback_days = 2               # 平常取最近 2 天：一次没跑成，下一次补上
backfill_days = 2               # 加入后两天内取全部还能取到的历史（约 640 个请求、24 MB）

[sources."deribit.dvol".resolutions]
"60" = { backfill_days_back = 200 }     # 1 分钟：接口只留约 6 个月，过期就没了
"3600" = { backfill_days_back = 2200 }  # 1 小时：接口从 2021 年 3 月指数开始时就有

[monitor]
issue_marker = "finresearch:outage"   # 监控开的问题里带这个标记，用来认出自己开过的问题
inactivity_warn_days = 45             # 公开仓库 60 天无活动会停用定时任务；45 天时提醒所有者
storage_quota_gb = 100                # Hugging Face 免费账户的私有存储额度（架构 7.3）
storage_warn_gb = 80                  # 决策 0010：私有数据集超过这么多就开问题，重新考虑存储
scheduled_workflows = [
  ".github/workflows/collect.yml",
  ".github/workflows/monitor.yml",
  ".github/workflows/archive.yml",
  ".github/workflows/u1-bars.yml",
  ".github/workflows/u1-crosscheck.yml",
  ".github/workflows/revised.yml",
  ".github/workflows/backup.yml",
]
