# 远程存储（决策 0003：Hugging Face 私有数据集）。
# 数据集名和令牌不写在这里：令牌放 GitHub Secrets 的 HF_TOKEN，数据集名放 GitHub
# Variables 的 HF_DATASET。数据集名里带着账户名，账户标识不进仓库。

[hub]
repo_type = "dataset"
revision = "main"
max_files_per_commit = 50       # Hugging Face 建议每次提交 50 到 100 个文件
max_entries_per_folder = 9000   # 硬限制是每个文件夹 10,000 个，留出余量
retries = 3                     # 网络或服务端的临时错误最多重试几次
retry_wait_seconds = 15
# Hugging Face 每个仓库每小时最多 128 次提交（2026-11-14 实测：一小时内加工了 100 多个月，之后的推送被拒绝，
# 提示"约 1 小时后重试"）。被限速时每 10 分钟再试一次，最多等 80 分钟，加工好的分区不白做
rate_limit_retries = 8
rate_limit_wait_seconds = 600

[selftest]
prefix = "_selftest"            # 自检只写在这个文件夹下，结束后删除
sizes_bytes = [1024, 1048576, 33554432]   # 1 KB、1 MB、32 MB
rounds = 3

[canonical]
row_group_rows = 131072         # 规范层 Parquet 的行组大小：只查几个品种时，按行组统计跳过其余部分
