# 模拟器的成交规则（Phase 4.3，src/finresearch/sim/engine.py；架构 5.4、决策 0012）。

[conservative]
# t 时刻做出的决定，最早在 t + 延迟之后开始的第一根 K 线成交。示意值：配合 1 分钟数据，
# 在一分钟结束时做的决定，跳过紧接着开始的那根，在下一根的开盘价成交。
latency_seconds = 60
limit_fill_fraction = 1.0   # 限价单被价格穿过时成交的比例
impact_multiplier = 1.0
# 没写到期时间的订单，生效（决定时刻 + 延迟）之后最多等这么多根 K 线的时长，超时撤单（docs/prior-art.md 的 L4）。
# 理由：K 线连续时，市价单在生效后的第一根 K 线就成交；Bybit 在没有成交的分钟里没有 K 线，
# 冷门合约可能几小时没有一根，没有上限的话订单会在很久以后、按与决定时已无关系的价格成交。
# 5 根留出几根空缺的余地，又把成交限制在决定之后几个周期以内（1 分钟数据上是 5 分钟，日线上是 5 天）。
# 按 K 线根数而不是秒数计，日线和分钟线上意思一样。示意值，没有用数据校准；要挂得更久的订单自己写到期时间。
max_wait_bars = 5

[stress]
latency_seconds = 120       # 延迟加倍
limit_fill_fraction = 0.5   # 限价单只成交一半，其余撤单
impact_multiplier = 2.0     # 冲击成本加倍
max_wait_bars = 5           # 与保守情形相同：等待上限不是压力情形要放大的假设
