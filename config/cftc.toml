# CFTC 持仓报告的公布时刻（Phase 2.6.5，所有者 2026-11-15 选定"精确规则加例外表"）。
#
# 规则：报告日（通常是周二）之后第 3 个工作日的 15:30（纽约时间）公布。工作日不含周末、
# 联邦假日（src/finresearch/core/us_calendar.py）和下面列出的临时关闭日。这条规则与官方
# 2026 年公布日程的 52 次逐个一致，也与 2024-11-26、2025-12-23 两期的延期公告一致（有测试）。
# 政府停摆期间的报告不按规则，按下面 shutdowns 表里官方公告的补发截止日。

release_time = "15:30"           # 纽约时间
release_zone = "America/New_York"
business_days_after = 3          # 周三收数据，周五下午公布：报告日之后第 3 个工作日
late_grace_hours = 24            # 预计公布之后过了这么久还没看到下一期，就当作晚了，报错提醒

# 联邦机构的临时关闭日（不是法定假日）：总统令、就职日（华盛顿）、恶劣天气。
# 只列出有把握的；漏掉的天气关闭可能让规则早一两天，见数据源目录的已知问题。
closures = [
  "2007-01-02",  # 福特总统国丧日
  "2008-12-26",  # 总统令
  "2009-01-20",  # 就职日
  "2012-10-29",  # 飓风桑迪，华盛顿联邦机构关闭
  "2012-10-30",
  "2012-12-24",  # 总统令
  "2013-01-21",  # 就职日（与马丁·路德·金纪念日同一天）
  "2014-12-26",  # 总统令
  "2015-12-24",  # 总统令
  "2017-01-20",  # 就职日
  "2018-12-05",  # 老布什总统国丧日
  "2018-12-24",  # 总统令
  "2019-12-24",  # 总统令
  "2020-12-24",  # 总统令
  "2021-01-20",  # 就职日
  "2024-12-24",  # 总统令
  "2025-01-09",  # 卡特总统国丧日
  "2025-01-20",  # 就职日（与马丁·路德·金纪念日同一天）
  "2025-12-24",  # CFTC 公告：联邦行政机构关闭
  "2025-12-26",
]

# 政府停摆：这些报告日的报告在停摆结束后按时间顺序补发。取官方公告里补发完毕的那一期的
# 公布日（偏晚的一边：最早补发的几期实际更早公布）。
[[shutdowns]]
first_report = "2013-10-01"
last_report = "2013-10-29"
released_by = "2013-11-08"       # CFTC 第 6745-13 号公告：11 月 8 日恢复原定日程
source = "https://www.cftc.gov/PressRoom/PressReleases/6745-13"

