# 成本模型（Phase 4.2，src/finresearch/sim/costs.py）。费率是各交易所公布的最低档，来源见路线图 Phase 4 的 4.0 核对表。
# 费率以小数记：0.0005 即 0.05%。

[fees.binance]           # U 本位合约
maker = 0.0002
taker = 0.0005           # 几个二手来源一致；另有一个说 0.04%，取较高的一边

[fees.bybit]             # USDT 永续合约（官方 VIP 页面）
maker = 0.0002
taker = 0.00055

[impact]
# 平方根冲击：冲击（占价格的比例）= y × 日波动率 × sqrt(成交金额 / 当日成交金额)，按峰值算在整笔成交上（偏保守）。
# 示意值，量级取自文献的常见说法，未核对；Phase 3 之后用 U1 探索集校准，校准值只存私有数据集（决策 0008）。
y = 1.0
# 冲击按"母单"算：同一品种、同一方向、在第一笔成交后这么多小时内的成交合起来算一笔。
# 取一天，与公式里"当日成交金额"的统计区间一致；拆成小单不会降低冲击成本。
metaorder_hours = 24

[scenarios]
# 成本情形：手续费、价差、冲击都乘以这个倍数；资金费是真实的现金流，不缩放。
zero = 0.0
normal = 1.0
double = 2.0
