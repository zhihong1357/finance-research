# 异地备份（Phase 2.9，决策 0014）：丢了就找不回的原始数据，每天在 Google Drive 再存一份。
# 授权的三个值放在 GitHub Secrets（GDRIVE_CLIENT_ID、GDRIVE_CLIENT_SECRET、GDRIVE_REFRESH_TOKEN）。

enabled = true                  # 2026-11-15 所有者存好授权；在分支上实测备份和演练都通过后打开
added = "2026-11-15T06:30:00Z"  # 打开的时刻；监控从这时起计算备份是否中断
folder = "finresearch-backup"   # Drive 里的文件夹名（应用只看得到它自己建的文件）
max_age_hours = 50              # 超过这么久没有成功的备份就开问题：每天一次，留两天余量
max_days_per_run = 60           # 一次最多传多少个"数据源·日"的包：第一次补历史时分几次做完
drill_files = 3                 # 每次核对随机取几个包，下载、解开、与数据集逐字节比对

# 要备份的数据源：数据源目录里不能重新下载的（快照类），加上修订版本表用到的（我们看到数据的
# 时刻不能重新下载）。有测试核对这份清单没有漏掉。
sources = [
  "deribit.book_summary",
  "hyperliquid.asset_ctxs",
  "nyfed.reference_rates",
  "philly.rtdsm",
  "cftc.cot_tff",
  "deribit.dvol",
  "heartbeat.canary",
]

[drive]
timeout_seconds = 120
retries = 3
retry_wait_seconds = 10
