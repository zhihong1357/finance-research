# 研究宇宙 U1 的时点表（Phase 2.5，决策 0010）：每张表由哪家交易所的哪些归档数据集加工而成。

[universe]
# 每家交易所进研究宇宙的合约：对归档里品种目录名的正则表达式。
# Binance：只要 USDT 永续合约，含已下架的。交割合约（带 _日期）、USDC 和 BUSD 合约不进；
# 目录名以 SETTLED 结尾的也不进：它们不是另一个合约，而是原品种数据的重复或交割暂停期（数据源目录）
binance = '^[^_]+USDT$'
# Bybit：USDT 永续合约，含已下架的和改了名的旧合约（ANTOLDUSDT 等，代码被重新使用前的那个合约）。
# 到期合约（带短横和日期）、事件合约（带下划线）、反向合约（以 USD 结尾）不进
bybit = '^[^_-]+USDT$'

[tables."u1.bars_1m"]
format = 1                      # 表格式版本：表结构一变就加一，写进新目录，旧分区不被覆盖

[tables."u1.bars_1m".binance]
monthly = "binance.um.klines_1m.monthly"   # 优先用月度文件
daily = "binance.um.klines_1m.daily"       # 某个品种某个月没有月度文件时，改用逐日文件
settle_days = 7                 # 一个月结束后等几天再加工：月度文件在下个月初陆续出现
workers = 16                    # 并行下载、核对、解析的线程数
batch = 64                      # 每批处理的品种数：限制内存里同时存在的表

[tables."u1.bars_1m".bybit]
daily = "bybit.trades.daily"    # Bybit 的归档只有逐日的逐笔成交，没有月度文件
settle_days = 7
workers = 8                     # 一个交易日的 BTCUSDT 解压后约 300 MB，并行数比 Binance 少
batch = 32

[crosscheck]
# 抽样核对（2.5.5，决策 0010）：随机抽一些合约日，用逐笔成交重算 1 分钟数据，与 Binance 的 K 线逐分钟比对。
# 结果是由数据得出的质量报告，只存私有数据集（决策 0008）；公开日志只写是否通过
trades = "binance.um.trades.daily"
klines = "binance.um.klines_1m.daily"
sample = 20                     # 每次抽几个合约日
max_differing_share = 0.0       # 允许不一致的分钟所占比例：K 线应当就是逐笔成交的精确汇总，所以是 0
workers = 16                    # 并行下载、解析的线程数
