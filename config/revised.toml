# 修订版本表（Phase 2.6，决策 0013）：由采集下来的全部原始响应合并成一张表，每次加工写一份完整的表。
# 内容与最新的一份相同就不写。工作流"修订版本表"按这里的列表逐张加工。

[tables."rates.nyfed"]
source = "nyfed.reference_rates"   # config/collect.toml 里的数据源
format = 1                         # 表的格式版本：格式变了就升，写到新目录，旧的不覆盖
part = "nyfed"                     # 文件名
conflicts = "refuse"               # 两次抓取对同一版本说法不一时报错：纽约联储公布后不改

[tables."macro.rtdsm"]
source = "philly.rtdsm"
format = 1
part = "rtdsm"
conflicts = "latest"               # 费城联储会更正旧版本里的录入错误：以最新一次抓取为准

[tables."positions.cftc"]
source = "cftc.cot_tff"
format = 1
part = "tff"
conflicts = "refuse"               # CFTC 说明已公布的历史不回改：说法不一就报错
