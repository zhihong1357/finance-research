# 归档清单（Phase 2.4）。交易所的公开归档可以随时重新下载，而且量很大，原始层只记
# 每个文件的地址、大小、校验和（架构 2.2 的例外）。每个数据集一张清单，按时间增量存放：
# 每次列目录只存新出现、有变化、消失的文件（data/manifest.py）。
#
# 每个数据集列出全部品种目录，包括已下架、已交割的合约和非 USDT 合约；研究宇宙
# （USDT 永续合约）在加工时（2.5）再筛选，筛选规则不在这里提前做。

[listing]
workers = 16                    # 并行列目录的线程数；Binance 一个日度数据集约 1,000 个品种、66 万个文件，16 个线程约 2 分钟
describe_workers = 16           # 只有文件名的归档（Bybit），逐个询问大小、ETag 和发布时间的并行数；只问以前没问过的文件
describe_max = 0                # 每次最多问几个。Bybit 的限速下问完 80 万个文件要两天，所以不问：大小、ETag 和发布时间在加工下载时记下（架构 2.2）
max_shown = 20                  # 有变化、消失的文件最多在日志里列出几个
max_skipped = 20                # 不认识的文件名超过这么多，就当作交易所改了命名规则：这次运行失败、什么都不存

[monitor]
max_age_hours = 200             # 每周一次（168 小时）加 32 小时余量；超过就开数据中断问题

[verify]
max_sample = 12                 # 每次运行随机抽查的文件数上限（数据集可以设得更少）
new_share = 0.5                 # 抽查名额里留给本次新出现文件的比例

# Binance 公开数据站：U 本位合约（um）。root 是存储桶里的目录，sub 是品种目录下的子目录（K 线按周期分）。
[datasets."binance.um.trades.daily"]
exchange = "binance"
root = "data/futures/um/daily/trades/"
sample = 6                      # 逐笔成交文件大（BTCUSDT 单日几十 MB），少抽几个
added = "2026-11-15T00:00:00Z"   # 加入的时刻；此后 max_age_hours 内还没有清单不算中断
enabled = true

[datasets."binance.um.aggtrades.daily"]
exchange = "binance"
root = "data/futures/um/daily/aggTrades/"
sample = 6
added = "2026-11-15T00:00:00Z"
enabled = true

[datasets."binance.um.klines_1m.daily"]
exchange = "binance"
root = "data/futures/um/daily/klines/"
