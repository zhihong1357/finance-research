# 细线（Phase 1.6）使用的合成世界。真实效应事先已知，用来检查整条流程算得对不对。
# 改动这里的任何数字都会改变配置指纹，已记账的试验需要新的运行才能对应。

seed = 20261113
first_month = "2000-01"
months = 240               # 2000-01 至 2019-12
beta = 0.5                 # 滞后月份的收益对真实指标的系数
lag_months = 2             # 指标领先收益的月数
release_noise = 0.8        # 首发值相对真实值的误差（标准差）
return_noise = 1.0         # 收益里与指标无关的部分（标准差）
first_release_days = 15    # 月份结束后多少天公布首发值
revision_days = 45         # 月份结束后多少天公布修订值（修订值就是真实值）
fetched_at = "2020-06-01T00:00:00Z"   # 模拟的一次性回补抓取时刻，晚于全部公布时间
confidence = 0.95          # 报告里置信区间的置信水平
